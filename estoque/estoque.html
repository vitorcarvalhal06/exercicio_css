<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .toolbar, .filters, .table-container, .details {
      margin: 10px;
      background: #ffffff;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .toolbar button, .pagination button {
      margin-right: 5px;
      padding: 5px 10px;
    }
    .filters select, .filters input, .details input {
      margin: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }
    .selected {
      background-color: #cce5ff;
    }
    .pagination {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      padding-top: 60px;
    }
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button onclick="limparBusca()">Limpar Filtros</button>
  <button onclick="exportarExcel()">Exportar para Excel</button>
  <button onclick="importarExcel()">Importar Excel</button>
  <button onclick="alterarProduto()">Alterar</button>
</div>

<div class="filters">
  <label>Marca:
    <select><option>&lt;Todos&gt;</option></select>
  </label>
  <label>Tipo:
    <select><option>&lt;Todos&gt;</option></select>
  </label>
  <label>Situação:
    <select><option>Ativos</option></select>
  </label>
  <label>Cód. Fabricante / Descrição:
    <input type="text" id="inputBusca" placeholder="Digite o código ou descrição">
  </label>
  <label>Preço:
    <input type="number" id="inputPrecoMin" placeholder="Min">
    <input type="number" id="inputPrecoMax" placeholder="Max">
  </label>
  <label>Disponível:
    <input type="number" id="inputDisponivelMin" placeholder="Min">
    <input type="number" id="inputDisponivelMax" placeholder="Max">
  </label>
  <button onclick="pesquisar()">Pesquisar</button>
  <button onclick="limparResultados()">Limpar Resultados</button>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>COD BARRA</th>
        <th>COD FABRIC</th>
        <th>COD AUXILIAR</th>
        <th>DESCRIÇÃO</th>
        <th>UN</th>
        <th>DISPONÍVEL</th>
        <th>R$</th>
        <th>GRUPO</th>
        <th>SUBGRUPO</th>
        <th>CATEGORIA</th>
      </tr>
    </thead>
    <tbody id="tabela-produtos">
      <!-- Itens aparecem aqui após busca -->
    </tbody>
  </table>
</div>

<div class="pagination">
  <button onclick="paginaAnterior()">Anterior</button>
  <span id="paginaAtual">1</span>
  <button onclick="proximaPagina()">Próxima</button>
</div>

<div class="details">
  <label>Disponível: <input type="number" id="inputDisponivel" value="0"></label>
  <button onclick="aplicarAlteracao()">Aplicar Alterações</button>
</div>

<div id="modalDetalhes" class="modal">

    <span class="close" onclick="fecharModal()">&times;</span>

    <label>Nome: <input type="text" id="inputNome"></label>

    <label>Grupo: <input type="text" id="inputGrupo"></label>
    <label>Subgrupo: <input type="text" id="inputSubgrupo"></label>
    <label>Categoria: <input type="text" id="inputCategoria"></label>
    <label>Unidade: <input type="text" id="inputUnidade"></label>
    <button onclick="salvarAlteracoes()">Salvar Alterações</button>

</div>

  let produtoSelecionado = null;
  let produtosFiltrados = [...produtos];
  let pagina = 1;
  const itensPorPagina = 10;

  function pesquisar() {
    const valorBusca = document.getElementById('inputBusca').value.trim().toUpperCase();
    const precoMin = parseFloat(document.getElementById('inputPrecoMin').value);
    const precoMax = parseFloat(document.getElementById('inputPrecoMax').value);
    const disponivelMin = parseInt(document.getElementById('inputDisponivelMin').value, 10);
    const disponivelMax = parseInt(document.getElementById('inputDisponivelMax').value, 10);

    produtosFiltrados = produtos.filter(produto =>
      (produto.codFabric.includes(valorBusca) || produto.descricao.toUpperCase().includes(valorBusca)) &&
      (isNaN(precoMin) || parseFloat(produto.preco) >= precoMin) &&
      (isNaN(precoMax) || parseFloat(produto.preco) <= precoMax) &&
      (isNaN(disponivelMin) || produto.disponivel >= disponivelMin) &&
      (isNaN(disponivelMax) || produto.disponivel <= disponivelMax)
    );

    pagina = 1;
    renderizarTabela();
  }

  function renderizarTabela() {
    const tabela = document.getElementById('tabela-produtos');
    tabela.innerHTML = '';
    const inicio = (pagina - 1) * itensPorPagina;
    const fim = inicio + itensPorPagina;
    const paginaProdutos = produtosFiltrados.slice(inicio, fim);

    if (paginaProdutos.length === 0) {
      tabela.innerHTML = '<tr><td colspan="10">Nenhum item encontrado</td></tr>';
      return;
    }

    paginaProdutos.forEach(produto => {
      const linha = document.createElement('tr');
      linha.innerHTML = `
        <td>${produto.codBarra}</td>
        <td>${produto.codFabric}</td>
        <td></td>
        <td>${produto.descricao}</td>
        <td>${produto.un}</td>
        <td>${produto.disponivel}</td>
        <td>${produto.preco}</td>
        <td>${produto.grupo}</td>
        <td>${produto.subgrupo}</td>
        <td>${produto.categoria}</td>
      `;
      linha.onclick = () => selecionarProduto(produto);
      tabela.appendChild(linha);
    });

    document.getElementById('paginaAtual').textContent = pagina;
  }

  function paginaAnterior() {
    if (pagina > 1) {
      pagina--;
      renderizarTabela();
    }
  }

  function proximaPagina() {
    if (pagina * itensPorPagina < produtosFiltrados.length) {
      pagina++;
      renderizarTabela();
    }
  }

  function selecionarProduto(produto) {
    produtoSelecionado = produto;
    document.getElementById('inputDisponivel').value = produto.disponivel;
    document.querySelectorAll('.table-container tr').forEach(linha => linha.classList.remove('selected'));
    const linhaSelecionada = Array.from(document.querySelectorAll('.table-container tr')).find(linha => linha.cells[0].textContent == produto.codBarra);
    if (linhaSelecionada) linhaSelecionada.classList.add('selected');
  }

  function fecharModal() {
    document.getElementById('modalDetalhes').style.display = 'none';
  }

  function aplicarAlteracao() {
    if (produtoSelecionado) {
      const novoValor = parseInt(document.getElementById('inputDisponivel').value, 10);
      produtoSelecionado.disponivel = isNaN(novoValor) ? 0 : novoValor;
      pesquisar();
      alert('Alteração aplicada com sucesso!');
    }
  }

  function limparResultados() {
    document.getElementById('tabela-produtos').innerHTML = '';
  }

  function limparBusca() {
    document.getElementById('inputBusca').value = '';
    limparResultados();
  }

  function exportarExcel() {
    const tabela = document.getElementById('tabela-produtos');
    const linhas = Array.from(tabela.querySelectorAll('tr'));
    let csvContent = "data:text/csv;charset=utf-8,";

    linhas.forEach(linha => {
      const colunas = Array.from(linha.querySelectorAll('td, th')).map(coluna => coluna.textContent);
      csvContent += colunas.join(",") + "\r\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "produtos.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function importarExcel() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv, .xls, .xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel';
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = event => {
        const data = event.target.result;
        const linhas = data.split('\n').map(linha => linha.split(','));
        const tabela = document.getElementById('tabela-produtos');
        tabela.innerHTML = '';

        // Adicionar cabeçalho
        const header = linhas[0];
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        header.forEach(coluna => {
          const th = document.createElement('th');
          th.textContent = coluna;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        tabela.appendChild(thead);

        // Adicionar linhas de dados
        const tbody = document.createElement('tbody');
        linhas.slice(1).forEach(linha => {
          const tr = document.createElement('tr');
          linha.forEach(coluna => {
            const td = document.createElement('td');
            td.textContent = coluna;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        tabela.appendChild(tbody);
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function ordenarTabela(coluna) {
    const ordem = coluna.dataset.ordem === 'asc' ? 'desc' : 'asc';
    coluna.dataset.ordem = ordem;
    const chave = coluna.textContent.toLowerCase().replace(' ', '');
    produtosFiltrados.sort((a, b) => {
      if (a[chave] < b[chave]) return ordem === 'asc' ? -1 : 1;
      if (a[chave] > b[chave]) return ordem === 'asc' ? 1 : -1;
      return 0;
    });
    renderizarTabela();
  }

  document.querySelectorAll('th').forEach(th => {
    th.onclick = () => ordenarTabela(th);
  });

  function confirmarExclusao() {
    if (confirm('Tem certeza que deseja excluir este produto?')) {
      // Lógica de exclusão
    }
  }

  function alterarProduto() {
    if (produtoSelecionado) {
      document.getElementById('inputNome').value = produtoSelecionado.descricao;
      document.getElementById('inputQuantidade').value = produtoSelecionado.disponivel;
      document.getElementById('inputGrupo').value = produtoSelecionado.grupo;
      document.getElementById('inputSubgrupo').value = produtoSelecionado.subgrupo;
      document.getElementById('inputCategoria').value = produtoSelecionado.categoria;
      document.getElementById('inputUnidade').value = produtoSelecionado.un;
      document.getElementById('modalDetalhes').style.display = 'block';
    } else {
      alert('Selecione um produto para alterar.');
    }
  }

  function salvarAlteracoes() {
    if (produtoSelecionado) {
      produtoSelecionado.descricao = document.getElementById('inputNome').value;
      produtoSelecionado.disponivel = parseInt(document.getElementById('inputQuantidade').value, 10);
      produtoSelecionado.grupo = document.getElementById('inputGrupo').value;
      produtoSelecionado.subgrupo = document.getElementById('inputSubgrupo').value;
      produtoSelecionado.categoria = document.getElementById('inputCategoria').value;
      produtoSelecionado.un = document.getElementById('inputUnidade').value;
      fecharModal();
      renderizarTabela();
      alert('Alterações salvas com sucesso!');
    }
  }
</script>
